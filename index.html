<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell App</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/app-icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <script src="script.js" defer></script>
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
  </head>
  <body>
    <header>
      <div class="content">
        <div class="header-left">
          <img
            src="./assets/icons/app-icon.svg"
            alt="white bestell app icon of paper bag and fork"
          />
          <p>
            Bestell <br />
            <span>App</span>
          </p>
        </div>
      </div>
    </header>
    <main>
      <div class="content"></div>

      <nav class="nav-wrapper">
        <div class="content">
          <ul class="nav-list">
            <li>
              <a class="nav-link home-link" href=""
                ><img src="./assets/icons/home-icon.svg" alt="home icon"
              /></a>
            </li>

            <li>
              <a class="nav-link profile-link" href=""
                ><img
                  src="./assets/icons/profile-icon.svg"
                  alt="person profile icon"
              /></a>
            </li>

            <li>
              <a class="nav-link orders-link" href=""
                ><img src="./assets/icons/app-icon.svg" alt="bestell app icon"
              /></a>
            </li>

            <li>
              <a class="nav-link basket-link" href=""
                ><img
                  src="./assets/icons/shopping-cart-white.svg"
                  alt="shopping cart icon"
              /></a>
            </li>
          </ul>
        </div>
      </nav>
    </main>
    <footer>
      
    </footer>
  </body>
</html>
